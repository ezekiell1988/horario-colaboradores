# /etc/nginx/sites-available/roll-manager.ezekl.com
# Copiar a la VM y luego habilitar con:
#   sudo ln -sf /etc/nginx/sites-available/roll-manager.ezekl.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# SSL agregado por Certbot:
#   sudo certbot --nginx -d roll-manager.ezekl.com

server {
    server_name roll-manager.ezekl.com;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    listen 80;
}
